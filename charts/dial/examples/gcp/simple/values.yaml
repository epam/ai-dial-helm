core:
  enabled: true
  serviceAccount:
    create: true
    annotations:
      iam.gke.io/gcp-service-account: "%%GCP_CORE_SERVICE_ACCOUNT%%"
  podAnnotations:
    # -- Annotation hack to restart core pod after each Helm chart upgrade
    autorestart: '{{ dateInZone "2006-01-02 15:04:05Z" (now) "UTC" }}'
  configuration:
    encryption:
      secret: "%%CORE_ENCRYPT_SECRET%%"
      key: "%%CORE_ENCRYPT_KEY%%"
  env:
    aidial.config.files: '["/mnt/secrets-store/aidial.config.json"]'
    aidial.storage.provider: "google-cloud-storage"
    aidial.storage.bucket: "%%GCP_CORE_STORAGE_BUCKET_NAME%%"
    aidial.storage.createBucket: "false"
    aidial.storage.prefix: "core"
    aidial.storage.overrides: '{"jclouds.oauth.credential-type": "bearerTokenCredentials"}'
    aidial.identityProviders.fake.jwksUrl: "http://fakeJwksUrl"
    aidial.identityProviders.fake.rolePath: "roles"
    aidial.identityProviders.fake.issuerPattern: "issuer"
  secrets:
    aidial.config.json: |
      {
        "models": {
          "gemini-3.5-flash": {
            "type": "chat",
            "displayName": "Google (Gemini)",
            "iconUrl": "Gemini.svg",
            "endpoint": "http://dial-vertexai.%%NAMESPACE%%.svc.cluster.local/openai/deployments/gemini-3.5-flash/chat/completions",
            "upstreams": [
              {
                "extraData": {
                  "region": "global"
                }
              }
            ]
          }
        },
        "keys": {
          "%%DIAL_API_KEY%%": {
            "role": "chat",
            "project": "example"
          }
        },
        "roles": {
          "chat": {
            "limits": {
              "gemini-3.5-flash": {}
            }
          }
        }
      }
  extraVolumes:
    - name: config
      secret:
        secretName: '{{ template "dialCore.names.fullname" . }}'
        items:
          - key: aidial.config.json
            path: aidial.config.json
  extraVolumeMounts:
    - name: config
      mountPath: "/mnt/secrets-store/aidial.config.json"
      subPath: aidial.config.json
      readOnly: true
  valkey:
    enabled: true
    auth:
      enabled: true
      aclUsers:
        default:
          password: "%%REDIS_PASSWORD%%"
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "%%CLUSTER_ISSUER%%" # To issue ssl certificate
    hosts:
      - dial.%%DOMAIN%%
    tls:
      - secretName: "dial-tls-secret"
        hosts:
          - dial.%%DOMAIN%%

chat:
  enabled: true
  env:
    # -- Base URL of your site for OAuth callback
    AUTH_CALLBACK_BASE_URL: "https://chat.%%DOMAIN%%"
    # -- URL to redirect after logout
    AUTH_POST_LOGOUT_REDIRECT_URI: "https://chat.%%DOMAIN%%"
    # -- DIAL core API endpoint
    # Internal service name (DNS name) of DIAL core service
    DIAL_CORE_URL: "http://dial-core.%%NAMESPACE%%.svc.cluster.local"
    # -- External or Internal URL of DIAL themes;
    # Same allowlist as for DIAL chat should be applied
    THEMES_CONFIG_HOST: "http://dial-themes.%%NAMESPACE%%.svc.cluster.local"
    # -- CORS origin for DIAL chat; should be the same as AUTH_CALLBACK_BASE_URL
    CORS_ORIGIN: "https://chat.%%DOMAIN%%"
  secrets:
    AUTH_SESSION_SECRET: "%%AUTH_SESSION_SECRET%%"
    AUTH_KEYCLOAK_CLIENT_ID: "%%AUTH_KEYCLOAK_CLIENT_ID%%"
    AUTH_KEYCLOAK_HOST: "%%AUTH_KEYCLOAK_HOST%%"
    AUTH_KEYCLOAK_SECRET: "%%AUTH_KEYCLOAK_SECRET%%"

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "%%CLUSTER_ISSUER%%" # To issue ssl certificate
    hosts:
      - chat.%%DOMAIN%%
    tls:
      - secretName: "chat-tls-secret"
        hosts:
          - chat.%%DOMAIN%%

themes:
  enabled: true

vertexai:
  enabled: true

  serviceAccount:
    create: true
    name: dial-vertexai
    annotations:
      iam.gke.io/gcp-service-account: "%%GCP_VERTEXAI_SERVICE_ACCOUNT%%"

  env:
    DIAL_URL: "http://dial-core.%%NAMESPACE%%.svc.cluster.local"
    GCP_PROJECT_ID: "%%GCP_PROJECT_ID%%"
    DEFAULT_REGION: "%%GCP_REGION%%"
