core:
  enabled: true
  podAnnotations:
    # -- Annotation hack to restart core pod after each Helm chart upgrade
    autorestart: '{{ dateInZone "2006-01-02 15:04:05Z" (now) "UTC" }}'
  configuration:
    encryption:
      secret: "%%CORE_ENCRYPT_SECRET%%"
      key: "%%CORE_ENCRYPT_KEY%%"
  env:
    aidial.config.files: '["/mnt/secrets-store/aidial.config.json"]'
    aidial.identityProviders.fake.jwksUrl: "http://fakeJwksUrl"
    aidial.identityProviders.fake.rolePath: "roles"
    aidial.identityProviders.fake.issuerPattern: "issuer"
    aidial.storage.prefix: "core"
  secrets:
    aidial.config.json: |
      {
        "models": {
          "gpt-chat-latest": {
            "type": "chat",
            "displayName": "GPT Chat Latest",
            "iconUrl": "gpt4.svg",
            "endpoint": "http://dial-openai.%%NAMESPACE%%.svc.cluster.local/openai/deployments/gpt-chat-latest/chat/completions",
            "upstreams": [
              {
                "endpoint": "https://%%AZURE_DEPLOYMENT_HOST%%/openai/v1/responses"
              }
            ]
          }
        },
        "keys": {
          "%%DIAL_API_KEY%%": {
            "role": "chat",
            "project": "example"
          }
        },
        "roles": {
          "chat": {
            "limits": {
              "gpt-chat-latest": {}
            }
          }
        }
      }
  extraVolumes:
    - name: config
      secret:
        secretName: '{{ template "dialCore.names.fullname" . }}'
        items:
          - key: aidial.config.json
            path: aidial.config.json
  extraVolumeMounts:
    - name: config
      mountPath: "/mnt/secrets-store/aidial.config.json"
      subPath: aidial.config.json
      readOnly: true
  valkey:
    enabled: true
    auth:
      enabled: true
      aclUsers:
        default:
          password: "%%REDIS_PASSWORD%%"
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "%%CLUSTER_ISSUER%%"
    hosts:
      - dial.%%DOMAIN%%
    tls:
      - secretName: "dial-tls-secret"
        hosts:
          - dial.%%DOMAIN%%

chat:
  enabled: true
  env:
    # -- Base URL of your site for OAuth callback
    AUTH_CALLBACK_BASE_URL: "https://chat.%%DOMAIN%%"
    # -- URL to redirect after logout
    AUTH_POST_LOGOUT_REDIRECT_URI: "https://chat.%%DOMAIN%%"
    # -- DIAL core API endpoint
    # Internal service name (DNS name) of DIAL core service
    DIAL_CORE_URL: "http://dial-core.%%NAMESPACE%%.svc.cluster.local"
    # -- External or Internal URL of DIAL themes;
    # Same allowlist as for DIAL chat should be applied
    THEMES_CONFIG_HOST: "http://dial-themes.%%NAMESPACE%%.svc.cluster.local"
    # -- CORS origin for DIAL chat; should be the same as AUTH_CALLBACK_BASE_URL
    CORS_ORIGIN: "https://chat.%%DOMAIN%%"
  secrets:
    AUTH_SESSION_SECRET: "%%AUTH_SESSION_SECRET%%"
    AUTH_COGNITO_CLIENT_ID: "%%AUTH_COGNITO_CLIENT_ID%%"
    AUTH_COGNITO_HOST: "%%AUTH_COGNITO_HOST%%"
    AUTH_COGNITO_SECRET: "%%AUTH_COGNITO_SECRET%%"
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "%%CLUSTER_ISSUER%%"
    hosts:
      - chat.%%DOMAIN%%
    tls:
      - secretName: "chat-tls-secret"
        hosts:
          - chat.%%DOMAIN%%

themes:
  enabled: true

openai:
  enabled: true

  env:
    DIAL_URL: "http://dial-core.%%NAMESPACE%%.svc.cluster.local"
