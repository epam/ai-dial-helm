# This is umbrella chart. It means that it doesn't contain resources itself, but combines several charts as dependencies.
# Configuration values represented here are either complimentary or override values from dependency charts for example purposes.
# Check dependency charts for hints and details about specific values, their defaults and extra configuration.

extraDeploy: []

### ai-dial-core configuration ###
core:
  # -- Enable/disable ai-dial-core
  enabled: true
  image:
    tag: 0.50.1
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

### ai-dial-chat configuration ###
chat:
  # -- Enable/disable ai-dial-chat
  enabled: true
  commonLabels:
    app.kubernetes.io/component: "application"
  image:
    repository: epam/ai-dial-chat
    tag: 1.3.1
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/health
    failureThreshold: 6
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/health
    failureThreshold: 6
  resourcesPreset: small

### ai-dial-chat-themes configuration ###
themes:
  # -- Enable/disable ai-dial-chat-themes
  enabled: true
  commonLabels:
    app.kubernetes.io/component: "webserver"
  image:
    repository: epam/ai-dial-chat-themes
    tag: 0.22.0
  containerPorts:
    http: 8080
  podSecurityContext:
    fsGroup: 101
  containerSecurityContext:
    enabled: true
    runAsUser: 101
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

### ai-dial-adapter-openai configuration ###
openai:
  # -- Enable/disable ai-dial-adapter-openai
  enabled: false
  commonLabels:
    app.kubernetes.io/component: "adapter"
  image:
    repository: epam/ai-dial-adapter-openai
    tag: 0.46.0
  # env:
  #   DIAL_USE_FILE_STORAGE: "true"
  #   DIAL_URL: "http://{{ .Release.Name }}-core"
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resourcesPreset: micro

### ai-dial-adapter-bedrock configuration ###
bedrock:
  # -- Enable/disable ai-dial-adapter-bedrock
  enabled: false
  commonLabels:
    app.kubernetes.io/component: "adapter"
  image:
    repository: epam/ai-dial-adapter-bedrock
    tag: 0.46.0
  # env:
  #   DIAL_URL: "http://{{ .Release.Name }}-core"
  secrets: {}
    # AWS_DEFAULT_REGION: "us-east-1"
    # AWS_ACCESS_KEY_ID: ""
    # AWS_SECRET_ACCESS_KEY: ""
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resourcesPreset: micro

### ai-dial-adapter-vertexai configuration ###
vertexai:
  # -- Enable/disable ai-dial-adapter-vertexai
  enabled: false
  commonLabels:
    app.kubernetes.io/component: "adapter"
  image:
    repository: epam/ai-dial-adapter-vertexai
    tag: 0.42.0
  # env:
  #   DIAL_URL: "http://{{ .Release.Name }}-core"
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resourcesPreset: small

### ai-dial-adapter-dial configuration ###
dial:
  # -- Enable/disable ai-dial-adapter-dial
  enabled: false
  commonLabels:
    app.kubernetes.io/component: "adapter"
  image:
    repository: epam/ai-dial-adapter-dial
    tag: 0.21.0
  # env:
  #   DIAL_URL: "http://{{ .Release.Name }}-core"
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resourcesPreset: micro

### ai-dial-model-provider configuration ###
# NOTE: ai-dial-model-provider is currently EXPERIMENTAL. Its configuration and behavior may change in future releases.
modelProvider:
  # -- Enable/disable ai-dial-model-provider (experimental)
  enabled: false
  # -- Resource names must be lowercase RFC 1123; the alias "modelProvider" is camelCase, so override the name
  nameOverride: "model-provider"
  commonLabels:
    app.kubernetes.io/component: "model-provider"
  image:
    repository: epam/ai-dial-model-provider
    tag: 0.1.0
  # env:
  #   DIAL_URL: "http://{{ .Release.Name }}-core"
  #   DIAL_USE_FILE_STORAGE: "true"
  secrets: {}
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resourcesPreset: small
